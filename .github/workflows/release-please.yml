name: release-please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  actions: write  # cancel superseded pending CI runs on the release branch

jobs:
  release:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release PR, or tag + GitHub Release on merge
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # RELEASE_PAT (fine-grained, this repo only, Contents+PR RW)
          # pushes as a user identity: the CI run its PR triggers starts
          # IMMEDIATELY instead of sitting in action_required (GitHub's
          # hold for GITHUB_TOKEN-pushed runs — the 0.31.0 trap). Absent
          # the secret, the fallback token keeps today's behavior: one
          # human approval per release PR.
          github-token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Checkout released commit
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches package version
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          python - <<'PY'
          import os
          import gov
          tag = os.environ["TAG"]            # e.g. v0.1.1
          version = gov.__version__           # e.g. 0.1.1
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match version {version}")
          print(f"version {version} matches tag {tag}")
          PY

      - name: Build distributions
        if: steps.release.outputs.release_created == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        if: steps.release.outputs.release_created == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          twine upload dist/*

  # D46: while the release PR is open, draft its missing HIGHLIGHTS
  # sections (gov verify-doc-sync --write) and AMEND them into the
  # release commit itself. The draft is a verbatim copy from CHANGELOG
  # under a self-declared draft heading — the usage rewrite stays human.
  #
  # Why amend and not a follow-up commit: the release PR's creation
  # fires a pull_request CI run on the pre-draft SHA, and for bot PRs
  # that run waits in action_required — a stale, doomed run a maintainer
  # could approve (0.31.0 shipped exactly this way). Amending makes the
  # branch head a SINGLE complete commit (CHANGELOG + version +
  # HIGHLIGHTS together), and the cancel step below removes every
  # pending run on a superseded SHA, so the only approvable run is the
  # complete one. On the merge push release_created is true and this
  # job skips: the section must already ship in the merge.
  highlights:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.release_created != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The amend push must ALSO be a user identity: a default-token
          # push re-creates the action_required hold on the run for the
          # amended SHA and the chain stalls there. Falls back with the
          # release action when the secret is unset.
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Draft HIGHLIGHTS into the release commit (amend)
        id: draft
        env:
          BRANCH: release-please--branches--master
        run: |
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "no release PR branch — nothing to draft"
            echo "amended=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          python -m pip install .
          gov verify-doc-sync --write
          if git diff --quiet -- gov/HIGHLIGHTS.md; then
            echo "HIGHLIGHTS already covers every pending version"
            echo "amended=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "govrail-release-bot"
          git config user.email "bot@users.noreply.github.com"
          git add gov/HIGHLIGHTS.md
          # into the release commit itself — the PR head is born complete
          git commit --amend --no-edit
          git push --force-with-lease origin "$BRANCH"
          echo "amended=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cancel superseded pending CI runs (pre-draft SHA)
        # The amended push fires a fresh pull_request run on the complete
        # SHA; the creation-time run (pre-draft) may still sit in
        # action_required. Approving it re-runs the race — cancel every
        # pending run that is not on the amended head.
        if: steps.draft.outputs.amended == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release-please--branches--master
          KEEP_SHA: ${{ steps.draft.outputs.head_sha }}
        run: |
          for id in $(gh api --paginate \
              "repos/${{ github.repository }}/actions/runs?branch=$BRANCH&status=action_required" \
              --jq '.workflow_runs[].id'); do
            sha=$(gh api "repos/${{ github.repository }}/actions/runs/$id" --jq .head_sha)
            if [ "$sha" != "$KEEP_SHA" ]; then
              echo "cancelling superseded run $id (pre-draft ${sha:0:7})"
              gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" || true
            fi
          done

      - name: Report the accumulating release PR (no auto-merge, D66)
        # Cadence policy (D66, supersedes the end-to-end unattended chain):
        # the release PR ACCUMULATES every release-worthy merge to master
        # and stays open — a human squash-merging it IS the release cut.
        # One deliberate merge = one tag + one PyPI publish; until then
        # nothing ships, no matter how green CI is. The drafting/amend
        # machinery above keeps the PR head complete and CI-valid while
        # it accumulates, so merging stays a single safe click.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          BRANCH: release-please--branches--master
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open \
                --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$pr" ]; then
            echo "no open release PR — nothing accumulating"
            exit 0
          fi
          echo "release PR #$pr is open and accumulating user-facing"
          echo "changes; merging it (squash) cuts the next release:"
          echo "  gh pr merge $pr --squash --delete-branch"
