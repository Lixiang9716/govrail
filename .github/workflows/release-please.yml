name: release-please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release PR, or tag + GitHub Release on merge
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout released commit
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.release.outputs.release_created == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches package version
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          python - <<'PY'
          import os
          import gov
          tag = os.environ["TAG"]            # e.g. v0.1.1
          version = gov.__version__           # e.g. 0.1.1
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match version {version}")
          print(f"version {version} matches tag {tag}")
          PY

      - name: Build distributions
        if: steps.release.outputs.release_created == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        if: steps.release.outputs.release_created == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install --upgrade twine
          twine upload dist/*

  # D46: while the release PR is open, draft its missing HIGHLIGHTS
  # sections (gov verify-doc-sync --write) straight onto the PR branch,
  # so the release merge lands CHANGELOG + version + HIGHLIGHTS together
  # and doc-sync never goes red on master (the post-release gap hit
  # 0.19.0 through 0.22.0, four hand-chased reds). The draft is a
  # verbatim copy from CHANGELOG under a self-declared draft heading —
  # the usage rewrite stays human. On the merge push release_created is
  # true and this job skips: the section must already ship in the merge.
  highlights:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.release_created != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Draft missing HIGHLIGHTS sections on the release PR
        env:
          BRANCH: release-please--branches--master
        run: |
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "no release PR branch — nothing to draft"
            exit 0
          fi
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          python -m pip install .
          gov verify-doc-sync --write
          if git diff --quiet -- gov/HIGHLIGHTS.md; then
            echo "HIGHLIGHTS already covers every pending version"
            exit 0
          fi
          git config user.name "govrail-release-bot"
          git config user.email "bot@users.noreply.github.com"
          git add gov/HIGHLIGHTS.md
          git commit -m "docs: HIGHLIGHTS sections drafted from CHANGELOG (D37, D46)"
          git push origin "$BRANCH"
