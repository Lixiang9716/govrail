name: CI

# ── Job taxonomy (orthogonal by design) ──────────────────────────────
# Daily development (every PR): lint, gates-cell (version matrix),
#   governance (the dogfooding DAG, once), windows + macos (platform
#   suites), e2e-docker (docker cells, one job per cell — a red cell is
#   rerunnable in isolation), gates (the stable required check).
# Release (master only): the same pipeline runs on the merge commit;
#   publishing itself lives in release-please.yml (tag-gated).
# Nightly (schedule): the perf scale tier — never on the PR path.
# ─────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # daily: the nightly perf tier only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Path-aware testing: a change that touches nothing the wheel or
    # the e2e image ships (docs, notes, repo prose) does not need the
    # platform suites, the hostile locale, the shadow install, or ten
    # docker cells — it needs lint, derive, governance, and ONE pytest
    # cell (the doc-facing tests live there). The gates summary stays
    # satisfiable: cell 3.12 runs unconditionally.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'gov/**'
              - 'tests/**'
              - 'scripts/**'
              - 'examples/**'
              - '.gov/**'
              - '.github/workflows/**'
              - 'gates.json'
              - 'pyproject.toml'
      - id: classify
        run: |
          if [ "${{ steps.filter.outputs.code }}" = "true" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    # Style + syntax-level correctness (ruff), minutes before anything
    # heavier starts.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff — pyflakes + syntax-level pycodestyle)
        run: ruff check .

  gates-cell:
    # Version matrix: the pytest suite on every supported interpreter.
    # Version-agnostic governance steps live in the `governance` job.
    # Docs-only changes keep ONE cell (3.12): the doc-facing pytest
    # (pairing, template sync, docs-vs-CLI, whatsnew) still runs; the
    # other interpreters re-test interpreter sensitivity a prose edit
    # cannot have.
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          # note-presence's auto base walks back from HEAD; shallow clones
          # would cascade to "everything is the change". Tags feed the
          # HIGHLIGHTS version-alignment guard (issue #92).
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # matrix lives in STEP ifs, not the job if (actionlint: the
      # matrix context is unavailable at job level). Docs-only keeps
      # cell 3.12 — the doc-facing tests live there; the other cells
      # start and skip in seconds, so the required gates summary never
      # starves.
      - name: Install
        if: needs.changes.outputs.docs_only != 'true' || matrix.python-version == '3.12'
        run: pip install -e ".[dev]"
      - name: Unit tests (pytest-xdist — workers overlap the subprocess waits)
        if: needs.changes.outputs.docs_only != 'true' || matrix.python-version == '3.12'
        run: pytest -q -n auto

  derive:
    needs: changes
    # The derived-truth regenerator (scripts/derive_all.py): README's
    # command block <- gov --help; the demo specimen <- live/template;
    # the i18n pairing examples <- DEFAULT_CONFIG. On PRs it is a drift
    # probe (red names the one command to run). On master merge pushes
    # it REGENERATES AND COMMITS: derived truths never sit stale on
    # master, and the PAT identity makes the push trigger CI, which
    # re-runs derive, finds no drift, and stops — one step to the fixed
    # point, loop-guarded by the bot-commit check.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Derive every derived truth
        run: |
          pip install -e . -q
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python scripts/derive_all.py --check
          else
            python scripts/derive_all.py
            if [ -n "$(git status --porcelain)" ]; then
              if git log -1 --format=%s | grep -q "^chore: mechanical derivation"; then
                echo "derive: HEAD is already a derivation commit that still drifts — stopping (loop guard); inspect the regenerators"
                exit 1
              fi
              git config user.name "govrail-derive-bot"
              git config user.email "bot@users.noreply.github.com"
              git add -A
              git commit -qm "chore: mechanical derivation — README block, demo specimen, i18n examples regenerated from their truth sources"
              git push
              echo "derive: committed the regenerated truths; the push's CI re-verifies (expect green)"
            fi
          fi

  governance:
    needs: changes
    # The dogfooding DAG, once: rejection cases prove every gate can
    # reject, and the full gate DAG runs green on its own repository.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Rejection cases
        run: gov self-test
      - name: Full gate DAG
        run: gov run --mode all

  gates:
    # The REQUIRED check's stable name (branch protection points here):
    # green iff lint, every version cell, and governance are green.
    needs: [lint, gates-cell, governance, derive]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "lint + all version cells + governance + derive green"

  backport-shadow:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # Issue #138: a py2-era `argparse` backport (PyPI argparse==1.4.0)
    # installed next to a wheel-installed gov must not break the CLI. The
    # reporter's environment, kept alive in CI: happy paths of every
    # add_subparsers-based command under the shadow, self-test and doctor
    # against it, on the non-editable (site-packages) install layout.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install wheel + fossil argparse backport
        run: |
          pip install argparse==1.4.0
          pip install .
      - name: CLI happy paths under the promoted shadow
        run: |
          SP=$(python -c 'import site; print(site.getsitepackages()[0])')
          export PYTHONPATH="$SP"
          set -e
          D=$(mktemp -d); cd "$D"; git init -q .
          gov init
          gov task new "Brief me"
          printf '\n## 9. Adopted\n' >> .gov/rules.md
          if gov task check; then echo "stale pin must fail check"; exit 1; fi
          gov task list
          D2=$(mktemp -d); cd "$D2"; git init -q .
          gov init
          echo '{"modes": {"all": ["ok"]}, "gates": [{"id":"ok","command":["true"]}]}' > gates.json
          # the overwrite is a recorded constitution change: re-baseline
          # the seal or the out-of-band precheck refuses the close
          # (--confirm-unattended: recorded as machine consent, caller =
          # the CI bot identity)
          gov verify-plane --write --confirm-unattended
          git add gates.json
          git -c user.email=t@t -c user.name=t commit -qm init
          gov task new "Close me"
          gov task close T-0001
      - name: Self-test under the shadow
        run: |
          SP=$(python -c 'import site; print(site.getsitepackages()[0])')
          PYTHONPATH="$SP" gov self-test
      - name: Doctor names the shadow
        run: |
          SP=$(python -c 'import site; print(site.getsitepackages()[0])')
          if PYTHONPATH="$SP" gov doctor; then
            echo "doctor must flag the shadowed argparse"; exit 1
          fi
          PYTHONPATH="$SP" gov doctor 2>&1 | grep -q "pip uninstall argparse"

  windows:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # Issue #168: the wheel is py3-none-any ("OS Independent"), so the CLI
    # and its own rejection proof must hold on Windows too — no fcntl
    # module, no coreutils true/false/sh on PATH. This is the reporter's
    # verified end-to-end (init / doctor / run on a fresh project) kept
    # alive in CI, plus the tools-family self-test and the pytest suite:
    # fixtures are portable as of #168's follow-up, and the few
    # POSIX-exec-inherent tests skip themselves by platform, named.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests (pytest-xdist)
        run: python -m pytest -q -n auto
      - name: Fresh-project smoke (init / doctor / run)
        shell: bash
        run: |
          set -e
          d=$(mktemp -d); cd "$d"
          git init -q .
          git -c user.email=t@t -c user.name=t commit -qm init --allow-empty
          gov init
          gov doctor
          gov run --mode all
      - name: Rejection cases (tools family)
        # The tools family IS the shipped product's proof (48 cases, all
        # green on this runner). The project family is THIS repo's own
        # dogfood — POSIX shell scripts by convention — and stays owned by
        # the ubuntu job's full `gov self-test`. Making .sh cases runnable
        # on Windows (or teaching self-test a named SKIP for them) is a
        # rule-6 semantics decision, deliberately not taken in #168.
        run: gov self-test --scope tools

  macos:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # The third declared platform: the pytest suite plus a fresh-project
    # smoke, on the same single interpreter the other host jobs use.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests (pytest-xdist)
        run: pytest -q -n auto
      - name: Fresh-project smoke (init / doctor / run)
        run: |
          set -e
          d=$(mktemp -d); cd "$d"
          git init -q .
          git -c user.email=t@t -c user.name=t commit -qm init --allow-empty
          gov init
          gov doctor
          gov run --mode all

  gbk-locale:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # Issue #172: the decode wall must hold on a host that does NOT speak
    # UTF-8 (zh_CN.GBK, user-space locale, PYTHONUTF8=0 keeps the
    # interpreter honest). The anti-vacuous probe lives in the pytest
    # suite (locale_bites pins hostility); the tools self-test runs the
    # plane's own contract here.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCPATH: ${{ github.workspace }}/locales
      LC_ALL: zh_CN.GBK
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the user-space GBK locale
        run: |
          command -v localedef >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq locales; }
          mkdir -p "$LOCPATH"
          localedef -i zh_CN -f GBK "$LOCPATH/zh_CN.GBK"
      - name: Install
        run: pip install -e ".[dev]"
      - name: The locale must really decode GBK — fail loud otherwise
        run: |
          python - <<'PY'
          import locale, os, subprocess, sys
          enc = locale.getpreferredencoding(False)
          if enc.lower() not in ("gbk", "cp936", "gb2312"):
              raise SystemExit(
                  f"expected a GBK-family preferred encoding, got {enc!r} "
                  "— the locale did not build")
          r = subprocess.run([sys.executable, "-c", "print('中文')"],
                             capture_output=True,
                             env={**os.environ, "PYTHONIOENCODING": "utf-8"})
          if not r.stdout:
              raise SystemExit("child produced no output — probe is vacuous")
          try:
              text = r.stdout.decode(enc)
          except UnicodeDecodeError:
              print("hostile locale OK: unpinned GBK decode crashes on "
                    "child UTF-8; encoding =", enc)
          else:
              if text.strip() == "中文":
                  raise SystemExit("child UTF-8 survived the decode — the "
                                   "locale is not hostile, this job is "
                                   "vacuous")
              print("hostile locale OK: unpinned decode mojibake'd child "
                    "UTF-8; encoding =", enc)
          PY
      - name: Unit tests under GBK (pytest-xdist)
        run: pytest -q -n auto
      - name: Rejection cases under GBK
        run: gov self-test
      - name: Full gate DAG under GBK
        run: gov run --mode all

  e2e-docker:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # The Docker E2E matrix, ONE JOB PER CELL (D58, split for orthogony):
    # a red cell is named, rerunnable, and never masks another cell. The
    # wheel is built fresh per cell; run.sh --cell owns build + run.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cell: ['3.10-slim', '3.11-slim', '3.12-slim', '3.13-slim',
               '3.12-alpine', '3.10-bookworm', 'nonroot', 'gbk',
               'cross', 'crossdir']
    env:
      GOV_DOCKER_E2E: '1'
      GOV_DOCKER_MIRROR: docker.io  # hub is reachable from hosted runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest (the matrix driver is a pytest wrapper)
        run: python -m pip install pytest
      - name: Run the cell
        run: tests/docker_e2e/run.sh --cell ${{ matrix.cell }}
        env:
          GOV_E2E_EXPECTED_VERSION: ''

  nightly:
    # The perf scale tier (10k/20k-file walks): nightly, never on the PR
    # path. GOV_E2E_NIGHTLY tiers 1 and 2 give the walker a scaling point.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run the nightly tier
        run: tests/docker_e2e/run.sh --cell nightly
        env:
          GOV_DOCKER_E2E: '1'
          GOV_DOCKER_MIRROR: docker.io
