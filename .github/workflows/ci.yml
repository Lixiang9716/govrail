name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # note-presence's auto base walks back from HEAD; shallow clones
          # would cascade to "everything is the change". Tags feed the
          # HIGHLIGHTS version-alignment guard (issue #92).
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Rejection cases
        run: gov self-test
      - name: Full gate DAG
        run: gov run --mode all

  backport-shadow:
    # Issue #138: a py2-era `argparse` backport (PyPI argparse==1.4.0)
    # installed next to a wheel-installed gov must not break the CLI. The
    # reporter's environment, kept alive in CI: happy paths of every
    # add_subparsers-based command under the shadow, self-test and doctor
    # against it, on the non-editable (site-packages) install layout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install wheel + fossil argparse backport
        run: |
          pip install argparse==1.4.0
          pip install .
      - name: CLI happy paths under the promoted shadow
        run: |
          SP=$(python -c 'import site; print(site.getsitepackages()[0])')
          export PYTHONPATH="$SP"
          set -e
          D=$(mktemp -d); cd "$D"; git init -q .
          gov init
          gov task new "Brief me"
          printf '\n## 9. Adopted\n' >> .gov/rules.md
          if gov task check; then echo "stale pin must fail check"; exit 1; fi
          gov task list
          D2=$(mktemp -d); cd "$D2"; git init -q .
          gov init
          echo '{"modes": {"all": ["ok"]}, "gates": [{"id":"ok","command":["true"]}]}' > gates.json
          git add gates.json
          git -c user.email=t@t -c user.name=t commit -qm init
          gov task new "Close me"
          gov task close T-0001
      - name: Self-test under the shadow
        run: |
          SP=$(python -c 'import site; print(site.getsitepackages()[0])')
          PYTHONPATH="$SP" gov self-test
      - name: Doctor names the shadow
        run: |
          SP=$(python -c 'import site; print(site.getsitepackages()[0])')
          if PYTHONPATH="$SP" gov doctor; then
            echo "doctor must flag the shadowed argparse"; exit 1
          fi
          PYTHONPATH="$SP" gov doctor 2>&1 | grep -q "pip uninstall argparse"

  windows:
    # Issue #168: the wheel is py3-none-any ("OS Independent"), so the CLI
    # and its own rejection proof must hold on Windows too — no fcntl
    # module, no coreutils true/false/sh on PATH. This is the reporter's
    # verified end-to-end (init / doctor / run on a fresh project) kept
    # alive in CI, plus the full self-test (tools family) and the pytest
    # suite: fixtures are portable as of #168's follow-up, and the few
    # POSIX-exec-inherent tests skip themselves by platform, named.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Fresh-project smoke (init / doctor / run)
        shell: bash
        run: |
          set -e
          d=$(mktemp -d); cd "$d"
          git init -q .
          git -c user.email=t@t -c user.name=t commit -qm init --allow-empty
          gov init
          gov doctor
          gov run --mode all
      - name: Rejection cases (tools family)
        # The tools family IS the shipped product's proof (48 cases, all
        # green on this runner). The project family is THIS repo's own
        # dogfood — POSIX shell scripts by convention — and stays owned by
        # the ubuntu job's full `gov self-test`. Making .sh cases runnable
        # on Windows (or teaching self-test a named SKIP for them) is a
        # rule-6 semantics decision, deliberately not taken in #168.
        run: gov self-test --scope tools
