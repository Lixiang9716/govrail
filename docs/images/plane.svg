<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="480" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#24292f">govrail — a governance plane for agent-driven development</text>

  <!-- agents column -->
  <g>
    <rect x="30" y="90" width="170" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="115" y="115" text-anchor="middle" font-size="13" fill="#0969da" font-weight="600">agent w1</text>
    <text x="115" y="132" text-anchor="middle" font-size="10" fill="#57606a">task claim · lease</text>
    <rect x="30" y="170" width="170" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="115" y="195" text-anchor="middle" font-size="13" fill="#0969da" font-weight="600">agent w2</text>
    <text x="115" y="212" text-anchor="middle" font-size="10" fill="#57606a">busy → exit 3</text>
    <rect x="30" y="250" width="170" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <text x="115" y="275" text-anchor="middle" font-size="13" fill="#0969da" font-weight="600">agent w3</text>
    <text x="115" y="292" text-anchor="middle" font-size="10" fill="#57606a">parallel branch</text>
    <text x="115" y="345" text-anchor="middle" font-size="12" fill="#57606a">coding agents</text>
    <text x="115" y="361" text-anchor="middle" font-size="10" fill="#8b949e">fast, untrusted, many</text>
  </g>

  <!-- plane -->
  <g>
    <rect x="290" y="70" width="380" height="290" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
    <text x="480" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#24292f">the plane  ·  gov CLI</text>

    <rect x="315" y="115" width="158" height="64" rx="6" fill="#fff" stroke="#1f883d" stroke-width="1.5"/>
    <text x="394" y="138" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f883d">gates</text>
    <text x="394" y="154" text-anchor="middle" font-size="9.5" fill="#57606a">path-scoped DAG</text>
    <text x="394" y="167" text-anchor="middle" font-size="9.5" fill="#57606a">exit 0/1/2 · fail loud</text>

    <rect x="490" y="115" width="158" height="64" rx="6" fill="#fff" stroke="#1f883d" stroke-width="1.5"/>
    <text x="569" y="138" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f883d">notes</text>
    <text x="569" y="154" text-anchor="middle" font-size="9.5" fill="#57606a">problem / decision /</text>
    <text x="569" y="167" text-anchor="middle" font-size="9.5" fill="#57606a">alternatives beaten</text>

    <rect x="315" y="196" width="158" height="64" rx="6" fill="#fff" stroke="#8250df" stroke-width="1.5"/>
    <text x="394" y="219" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8250df">leases + task cards</text>
    <text x="394" y="235" text-anchor="middle" font-size="9.5" fill="#57606a">one worker, one card</text>
    <text x="394" y="248" text-anchor="middle" font-size="9.5" fill="#57606a">rules@hash briefs</text>

    <rect x="490" y="196" width="158" height="64" rx="6" fill="#fff" stroke="#8250df" stroke-width="1.5"/>
    <text x="569" y="219" text-anchor="middle" font-size="12.5" font-weight="600" fill="#8250df">seal + ritual ledger</text>
    <text x="569" y="235" text-anchor="middle" font-size="9.5" fill="#57606a">tamper-evident config</text>
    <text x="569" y="248" text-anchor="middle" font-size="9.5" fill="#57606a">recorded re-baselines</text>

    <rect x="315" y="277" width="333" height="58" rx="6" fill="#fff" stroke="#9a6700" stroke-width="1.5"/>
    <text x="481" y="299" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9a6700">receipts + rejection cases</text>
    <text x="481" y="315" text-anchor="middle" font-size="9.5" fill="#57606a">a green run cites evidence · every gate proves it can reject</text>
    <text x="481" y="328" text-anchor="middle" font-size="9.5" fill="#57606a">gov recall — memory read before proposals</text>
  </g>

  <!-- repo -->
  <g>
    <rect x="760" y="150" width="170" height="100" rx="10" fill="#f0fff4" stroke="#1f883d" stroke-width="2"/>
    <text x="845" y="188" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f883d">repository</text>
    <text x="845" y="210" text-anchor="middle" font-size="10" fill="#57606a">verified history</text>
    <text x="845" y="226" text-anchor="middle" font-size="10" fill="#57606a">the adoption anchor</text>
  </g>

  <!-- flows -->
  <line x1="200" y1="150" x2="286" y2="150" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="243" y="142" text-anchor="middle" font-size="9.5" fill="#57606a">propose</text>
  <line x1="670" y1="200" x2="756" y2="200" stroke="#57606a" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="713" y="192" text-anchor="middle" font-size="9.5" fill="#57606a">verified</text>
  <!-- recall feedback loop -->
  <path d="M 480 360 C 480 385 115 385 115 316" fill="none" stroke="#8250df" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrb)"/>
  <text x="297" y="382" text-anchor="middle" font-size="9.5" fill="#8250df">recall: memory before proposals</text>
</svg>
