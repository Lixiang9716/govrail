<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="govrail totem: a whale's tail over parallel rails and a seal — power riding governed tracks">
  <!-- the fluke: the whale, tips up, notch to the sky -->
  <g fill="#0969da">
    <path d="M 120 104 Q 68 64 44 40 Q 104 102 124 120 Z"/>
    <path d="M 120 104 Q 172 64 196 40 Q 136 102 116 120 Z"/>
  </g>

  <!-- the rails: parallel gold tracks the power rides -->
  <g stroke="#d4a72c" stroke-width="8" stroke-linecap="round">
    <line x1="60" y1="140" x2="180" y2="140"/>
    <line x1="60" y1="190" x2="180" y2="190"/>
  </g>

  <!-- the seal: one ring, one point — the only verdict -->
  <circle cx="120" cy="165" r="14" fill="none" stroke="#0969da" stroke-width="5"/>
  <circle cx="120" cy="165" r="4.5" fill="#cf222e"/>
</svg>
