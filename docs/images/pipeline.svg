<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="parr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#24292f">how a change ships — merge to PyPI, unattended</text>

  <!-- lane 1: PR CI (path-aware) -->
  <rect x="30" y="55" width="250" height="92" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.8"/>
  <text x="155" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#24292f">PR — path-aware CI</text>
  <rect x="45" y="90" width="220" height="22" rx="5" fill="#fff" stroke="#0969da" stroke-width="1.2"/>
  <text x="155" y="105" text-anchor="middle" font-size="9.5" fill="#0969da">docs diff → lint · derive · governance · 1 cell</text>
  <rect x="45" y="117" width="220" height="22" rx="5" fill="#fff" stroke="#9a6700" stroke-width="1.2"/>
  <text x="155" y="132" text-anchor="middle" font-size="9.5" fill="#9a6700">code diff → full matrix · 3 platforms · 10 cells</text>

  <!-- merge -->
  <line x1="280" y1="101" x2="330" y2="101" stroke="#57606a" stroke-width="1.6" marker-end="url(#parr)"/>
  <rect x="332" y="72" width="96" height="58" rx="9" fill="#f0fff4" stroke="#1f883d" stroke-width="2"/>
  <text x="380" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#1f883d">merge</text>
  <text x="380" y="113" text-anchor="middle" font-size="9" fill="#57606a">gates green</text>

  <!-- release PR -->
  <line x1="428" y1="101" x2="478" y2="101" stroke="#57606a" stroke-width="1.6" marker-end="url(#parr)"/>
  <rect x="480" y="55" width="180" height="92" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.8"/>
  <text x="570" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#24292f">release PR</text>
  <text x="570" y="99" text-anchor="middle" font-size="9.5" fill="#57606a">HIGHLIGHTS draft amended</text>
  <text x="570" y="113" text-anchor="middle" font-size="9.5" fill="#57606a">into the release commit</text>
  <text x="570" y="127" text-anchor="middle" font-size="9.5" fill="#57606a">stale runs cancelled</text>
  <text x="570" y="141" text-anchor="middle" font-size="9.5" fill="#57606a">auto-merge armed</text>

  <!-- auto chain -->
  <line x1="660" y1="101" x2="710" y2="101" stroke="#57606a" stroke-width="1.6" marker-end="url(#parr)"/>
  <rect x="712" y="55" width="218" height="92" rx="10" fill="#faf5ff" stroke="#8250df" stroke-width="1.8"/>
  <text x="821" y="78" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8250df">unattended chain</text>
  <text x="821" y="99" text-anchor="middle" font-size="9.5" fill="#57606a">checks green → auto squash-merge</text>
  <text x="821" y="113" text-anchor="middle" font-size="9.5" fill="#57606a">tag + GitHub Release</text>
  <text x="821" y="127" text-anchor="middle" font-size="9.5" fill="#57606a">twine → PyPI</text>
  <text x="821" y="141" text-anchor="middle" font-size="9.5" fill="#57606a">a red PR never merges</text>

  <!-- bottom rail: dogfood loop -->
  <rect x="30" y="185" width="900" height="86" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#24292f">the plane governs itself — every rule above ships as a gate this repository runs on itself</text>
  <text x="480" y="233" text-anchor="middle" font-size="10" fill="#57606a">52 tool rejection cases + 11 project cases · sealed constitution · ritual ledger · truth-source register (17 rows, each pinned by a test)</text>
  <text x="480" y="251" text-anchor="middle" font-size="10" fill="#57606a">CI health is itself gated · derived docs regenerate themselves · releases publish end to end</text>
</svg>
