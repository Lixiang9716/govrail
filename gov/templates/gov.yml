name: gov
# govrail: generated by `gov init --ci`; `gov uninstall` removes it.
on:
  push:
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: note-presence's auto base walks back from HEAD
          # (upstream..HEAD, else HEAD~1) and needs the commits present.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install govrail
        # Pinned by `gov init --ci` to the version that ran init: an
        # unpinned install coupled every adopter's CI to the vendor's
        # next release. Upgrade deliberately (bump the pin; `gov init
        # --upgrade` reports template drift).
        run: pip install govrail==__GOV_VERSION__
      - name: Run the gate DAG
        run: gov run
