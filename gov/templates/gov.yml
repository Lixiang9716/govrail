name: gov
# govrail: generated by `gov init --ci`; `gov uninstall` removes it.
# Single-run triggers: an unfiltered push hook runs the DAG twice per
# change (branch push + PR event). Branch coverage belongs to the PR;
# the push covers the default branch's own merges. main+master covers
# both common defaults — trim to yours if you like.
on:
  push:
    branches: [main, master]
  pull_request:
# Superseded runs cancel: a newer push's verdict is the branch's state;
# an interleaved stale run answering late reads as a flake.
concurrency:
  group: gov-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    # A hung gate dies in minutes, not in GitHub's 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: note-presence's auto base walks back from HEAD
          # (upstream..HEAD, else HEAD~1) and needs the commits present.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install govrail
        # Pinned by `gov init --ci` to the version that ran init: an
        # unpinned install coupled every adopter's CI to the vendor's
        # next release. Upgrade deliberately (bump the pin; `gov init
        # --upgrade` reports template drift).
        run: pip install govrail==__GOV_VERSION__
      - name: Run the gate DAG
        run: gov run
